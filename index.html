<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype Hub</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",Arial,sans-serif;color:#262626;background:#f5f5f5}*{box-sizing:border-box}body{margin:0}.page{max-width:1040px;margin:0 auto;padding:88px 24px}.eyebrow{margin:0 0 12px;color:#1677ff;font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}.title{margin:0;color:#262626;font-size:40px;line-height:1.2}.description{max-width:640px;margin:16px 0 40px;color:#595959;font-size:16px;line-height:1.7}.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.project{display:block;padding:24px;background:#fff;border:1px solid #f0f0f0;border-radius:8px;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s}.project:hover{border-color:#91caff;box-shadow:0 6px 16px rgba(0,0,0,.08)}.project h2{margin:0 0 8px;color:#1677ff;font-size:20px}.project p{margin:0;color:#595959;line-height:1.6}.tag{display:inline-block;margin-top:16px;padding:2px 8px;border:1px solid #91caff;border-radius:4px;background:#e6f4ff;color:#1677ff;font-size:12px}
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Static Prototype Hub</p>
    <h1 class="title">Prototype Hub</h1>
    <p class="description">A collection of interactive static prototypes. New projects will be added here over time.</p>
    <section class="projects" aria-label="Projects">
      <a class="project" href="./dp-hub-admin/">
        <h2>DP Hub Admin</h2>
        <p>Interactive static prototype for the Digital Product Admin user management module.</p>
        <span class="tag">Open prototype</span>
      </a>
    </section>
  </main>
</body>
</html>
