<body>
  <div id="root"></div>
  <script src="../vendor/react-18.3.1.min.js"></script>
  <script src="../vendor/react-dom-18.3.1.min.js"></script>
  <script src="../vendor/ant-design-icons-5.6.1.min.js"></script>
  <script src="../vendor/dayjs-1.11.23.min.js"></script>
  <script src="../vendor/antd-5.24.8.min.js"></script>
  <script>
    const h = React.createElement;
    const { Layout, Menu, ConfigProvider, Button, Select, Table, Space, Tooltip, Empty, Drawer, Tag, Typography, Descriptions, Input, Tree, Tabs } = antd;
    const icon = name => h(icons[name]);

    const hierarchy = [
      { l1: 'Mobile Recharge', children: [
        { l2: 'Prepaid', l3: ['Airtime', 'Data Package', 'Voice Package', 'Combo Package', 'SMS Package', 'Roaming Package'] },
        { l2: 'Postpaid', l3: [] },
        { l2: 'Voucher', l3: ['Physical Voucher', 'eVoucher', 'PIN Voucher'] }
      ] },
      { l1: 'Game', children: [
        { l2: 'Game Credit', l3: ['Direct Top-up', 'Game Voucher', 'Gift Code'] },
        { l2: 'Subscription', l3: ['Monthly Pass', 'Season Pass'] },
        { l2: 'In-game Item', l3: ['Currency Pack', 'Item Pack', 'Starter Pack'] }
      ] },
      { l1: 'Entertainment', children: [
        { l2: 'Video Streaming', l3: ['Monthly Subscription', 'Annual Subscription', 'Premium Plan', 'Sports Pass', 'Kids Package', 'Movie Package', 'TV Package', 'Mobile Plan', 'Family Plan', 'Student Plan', 'Pay-per-view'] },
        { l2: 'Music Streaming', l3: ['Individual Plan', 'Family Plan'] }
      ] },
      { l1: 'Utility', children: [
        { l2: 'Electricity', l3: ['Prepaid Token', 'Postpaid Bill'] },
        { l2: 'Water', l3: ['Residential Bill', 'Commercial Bill'] },
        { l2: 'Internet', l3: ['Broadband Bill', 'Fiber Package'] }
      ] },
      { l1: 'Financial Service', children: [
        { l2: 'E-wallet', l3: ['Wallet Top-up', 'Wallet Voucher'] },
        { l2: 'Insurance', l3: [] }
      ] }
    ];

    const typeOptions = hierarchy.map(group => ({ value: group.l1, label: group.l1 }));
    const productTypeOptions = hierarchy.flatMap(group => group.children.map(item => ({ value: item.l2, label: item.l2 })));
    const subProductTypeOptions = hierarchy.flatMap(group => group.children.flatMap(item => item.l3.map(name => ({ value: name, label: name }))));
    const fuzzyFilterOption = (input, option) => String(option.label || '').toLowerCase().includes(input.trim().toLowerCase());

    const menuItems = [
      { key: 'order', icon: icon('FolderOpenOutlined'), label: 'Order' },
      { key: 'product-pool', icon: icon('ShoppingOutlined'), label: 'Product Pool', children: [
        { key: 'item-management', label: 'Item Management', children: [
          { key: 'published-item', label: 'Published Item' },
          { key: 'manual-upload-item', label: 'Manual Upload Item' },
          { key: 'staging-pool', label: 'Staging Pool' }
        ] },
        { key: 'product-management', label: 'Product Management' },
        { key: 'type-management', label: 'Category Management' },
        { key: 'mapping-management', label: 'Mapping Management' },
        { key: 'mass-edit-margin', label: 'Mass Edit Margin' },
        { key: 'mass-edit-product', label: 'Mass Edit Product' },
        { key: 'virtual-product', label: 'Virtual Product' }
      ] },
      { key: 'routing', icon: icon('PartitionOutlined'), label: 'Routing' },
      { key: 'provider', icon: icon('UserOutlined'), label: 'Provider' },
      { key: 'partner', icon: icon('InboxOutlined'), label: 'Partner' },
      { key: 'setting', icon: icon('SettingOutlined'), label: 'Setting' },
      { key: 'event', icon: icon('CalendarOutlined'), label: 'Event' },
      { key: 'stock', icon: icon('AppstoreOutlined'), label: 'Stock' },
      { key: 'tools', icon: icon('ToolOutlined'), label: 'Tools' },
      { key: 'file-download', icon: icon('DownloadOutlined'), label: 'File Download' },
      { key: 'approval-flow-config', icon: icon('AuditOutlined'), label: 'Approval Flow Config' },
      { key: 'clearing-settlement', icon: icon('FundOutlined'), label: 'Clearing & Settlement' },
      { key: 'funding-management', icon: icon('DatabaseOutlined'), label: 'Funding Management' },
      { key: 'reconciliation', icon: icon('ProfileOutlined'), label: 'Reconciliation' }
    ];

    function filterHierarchy(source, filters) {
      const l1Query = filters.l1.trim().toLowerCase();
      const l2Query = filters.l2.trim().toLowerCase();
      const l3Query = filters.l3.trim().toLowerCase();
      if (!l1Query && !l2Query && !l3Query) return source;
      return source.reduce((result, group) => {
        const l1Match = !l1Query || group.l1.toLowerCase().includes(l1Query);
        if (!l1Match) return result;
        const matchingChildren = group.children.filter(item => {
          const l2Match = !l2Query || item.l2.toLowerCase().includes(l2Query);
          const l3Match = !l3Query || item.l3.some(name => name.toLowerCase().includes(l3Query));
          return l2Match && l3Match;
        });
        if (matchingChildren.length) result.push({ ...group, children: matchingChildren });
        return result;
      }, []);
    }

    function flattenHierarchy(groups) {
      const rows = [];
      groups.forEach((group, groupIndex) => {
        group.children.forEach((item, index) => rows.push({
          key: group.l1 + '-' + item.l2, l1: group.l1, l2: item.l2, l3: item.l3,
          rowSpan: index === 0 ? group.children.length : 0,
          isAltGroup: groupIndex % 2 === 1
        }));
      });
      return rows;
    }

    function flattenHierarchyAsTree(groups) {
      const rows = [];
      groups.forEach((group, groupIndex) => {
        const l1RowSpan = group.children.reduce((sum, item) => sum + Math.max(item.l3.length, 1), 0);
        let firstL1Row = true;
        group.children.forEach(item => {
          const subTypes = item.l3.length ? item.l3 : [null];
          subTypes.forEach((subType, index) => {
            rows.push({
              key: group.l1 + '-' + item.l2 + '-' + (subType || 'empty'),
              l1: group.l1,
              l2: item.l2,
              l3Name: subType,
              l1RowSpan: firstL1Row ? l1RowSpan : 0,
              l2RowSpan: index === 0 ? subTypes.length : 0,
              isAltGroup: groupIndex % 2 === 1
            });
            firstL1Row = false;
          });
        });
      });
      return rows;
    }

    function buildPropertyDetails(record, propertyType = 'static') {
      return Array.from({ length: 10 }, (_, index) => ({
        key: propertyType + '-property-' + (index + 1),
        property: 'Property ' + (index + 1),
        dataSource: propertyType === 'dynamic' ? 'Provider API' : index === 1 ? 'Single select by Ops' : 'Input by Ops',
        options: propertyType === 'static' && index === 1 ? ['Option 1', 'Option 2', 'Option 3', 'Option 4'] : null,
        description: propertyType === 'dynamic'
          ? 'Dynamic value returned by the configured data source for ' + record.l3 + '.'
          : index === 0
            ? 'Text value entered by Ops for ' + record.l3 + '.'
            : index === 1
              ? 'A single value selected by Ops from the configured options for ' + record.l3 + '.'
              : 'Explains the meaning and expected value of Property ' + (index + 1) + ' for ' + record.l3 + '.'
      }));
    }

    function CategoryWorkspace({ mode, onOpenDetails }) {
      const initialGroup = hierarchy[0];
      const initialProduct = initialGroup.children[0];
      const [selection, setSelection] = React.useState({ l1: initialGroup.l1, l2: initialProduct.l2, l3: null });
      const [searchText, setSearchText] = React.useState('');
      const [listQuery, setListQuery] = React.useState('');
      const keyFor = path => JSON.stringify(path);
      const [expandedKeys, setExpandedKeys] = React.useState([keyFor([initialGroup.l1]), keyFor([initialGroup.l1, initialProduct.l2])]);
      const l2ListRef = React.useRef(null);
      const l3ListRef = React.useRef(null);
      const treeRef = React.useRef(null);
      const treeScrollRef = React.useRef(null);
      const group = hierarchy.find(item => item.l1 === selection.l1) || initialGroup;
      const product = group.children.find(item => item.l2 === selection.l2) || group.children[0];
      const currentLeaf = selection.l3 && product.l3.includes(selection.l3) ? selection.l3 : null;
      const record = currentLeaf ? { l1: group.l1, l2: product.l2, l3: currentLeaf } : null;
      const leafCount = hierarchy.reduce((total, entry) => total + entry.children.reduce((count, child) => count + child.l3.length, 0), 0);

      React.useEffect(() => {
        if (mode === 'explorer' && !currentLeaf && product.l3.length) {
          setSelection({ l1: group.l1, l2: product.l2, l3: product.l3[0] });
        }
        if (mode === 'explorer') {
          setExpandedKeys(keys => [...new Set([...keys, keyFor([group.l1]), keyFor([group.l1, product.l2])])]);
        }
      }, [mode]);
      React.useEffect(() => { if (l2ListRef.current) l2ListRef.current.scrollTop = 0; }, [selection.l1]);
      React.useEffect(() => { if (l3ListRef.current) l3ListRef.current.scrollTop = 0; }, [selection.l1, selection.l2, listQuery]);
      React.useEffect(() => {
        const frame = requestAnimationFrame(() => {
          const container = mode === 'explorer' ? treeScrollRef.current : l3ListRef.current;
          const selected = container && container.querySelector(mode === 'explorer' ? '.ant-tree-node-selected' : '[aria-pressed="true"]');
          if (!selected) return;
          const bounds = container.getBoundingClientRect();
          const item = selected.getBoundingClientRect();
          if (item.top < bounds.top) container.scrollTop -= bounds.top - item.top + 8;
          else if (item.bottom > bounds.bottom) container.scrollTop += item.bottom - bounds.bottom + 8;
        });
        return () => cancelAnimationFrame(frame);
      }, [mode, selection.l1, selection.l2, currentLeaf]);

      const searchOptions = React.useMemo(() => hierarchy.flatMap(parent => [
        { path: [parent.l1] },
        ...parent.children.flatMap(child => [
          { path: [parent.l1, child.l2] },
          ...child.l3.map(name => ({ path: [parent.l1, child.l2, name] }))
        ])
      ]).map(({ path }) => ({
        value: keyFor(path),
        searchLabel: path.join(' / '),
        label: h('div', { className: 'category-search-option' }, [
          h('div', { className: 'category-search-title', key: 'title' }, [h('span', { key: 'name' }, path[path.length - 1]), h('span', { className: 'category-search-level', key: 'level' }, 'L' + path.length)]),
          h('div', { className: 'category-search-path', key: 'path' }, path.join(' / '))
        ])
      })), []);

      const treeData = React.useMemo(() => hierarchy.map(parent => ({
        key: keyFor([parent.l1]), title: h('span', { className: 'category-tree-title' }, parent.l1), categoryPath: [parent.l1],
        children: parent.children.map(child => ({
          key: keyFor([parent.l1, child.l2]), title: h('span', { className: 'category-tree-title' }, child.l2), categoryPath: [parent.l1, child.l2],
          isLeaf: child.l3.length === 0,
          children: child.l3.map(name => ({ key: keyFor([parent.l1, child.l2, name]), title: h('span', { className: 'category-tree-title' }, name), categoryPath: [parent.l1, child.l2, name], isLeaf: true }))
        }))
      })), []);

      function selectPath(path, fromSearch = false) {
        const parent = hierarchy.find(item => item.l1 === path[0]);
        if (!parent) return;
        const child = parent.children.find(item => item.l2 === path[1]) || parent.children[0];
        const leaf = path[2] && child.l3.includes(path[2]) ? path[2] : mode === 'explorer' ? child.l3[0] || null : null;
        const next = { l1: parent.l1, l2: child.l2, l3: leaf };
        setSelection(next);
        if (fromSearch || path.length < 3) setListQuery('');
        setSearchText('');
        setExpandedKeys(keys => [...new Set([...(fromSearch ? [] : keys), keyFor([parent.l1]), keyFor([parent.l1, child.l2])])]);
        if (path.length === 3 && mode === 'cascading') onOpenDetails(next);
        if (fromSearch && mode === 'explorer') requestAnimationFrame(() => { if (treeRef.current) treeRef.current.scrollTo({ key: keyFor(leaf ? [parent.l1, child.l2, leaf] : [parent.l1, child.l2]) }); });
      }

      function categoryButton(name, selected, onClick, extra, leaf = false) {
        return h('button', {
          key: name, type: 'button', className: 'category-row' + (leaf ? ' category-leaf-row' : ''),
          'aria-pressed': selected, 'aria-label': leaf ? 'View properties for ' + name : name, onClick
        }, [
          h('span', { className: 'category-row-name', key: 'name' }, name),
          h('span', { className: 'category-row-meta', key: 'meta' }, extra),
          leaf ? h('span', { className: 'category-leaf-action', key: 'action' }, 'View properties') : h('span', { className: 'category-row-arrow', key: 'arrow', 'aria-hidden': true }, icon('RightOutlined'))
        ]);
      }

      const filteredLeaves = product.l3.filter(name => name.toLowerCase().includes(listQuery.trim().toLowerCase()));
      const propertyColumns = [
