<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IEvent List · Digital Product Admin</title>
  <link rel="stylesheet" href="vendor/antd-5.24.8-reset.css">
  <style>
    :root{font-family:Roboto,"PingFang SC",Arial,sans-serif;color:#262626;background:#f5f5f5}
    *{box-sizing:border-box}html,body,#root{height:100%;min-width:1180px;margin:0}
    .app{height:100vh;overflow:hidden}.sider.ant-layout-sider{background:#fff!important;border-right:1px solid #f0f0f0}
    .brand{height:64px;display:flex;align-items:center;gap:9px;padding:0 24px;color:#1677ff;font-size:16px;font-weight:600}.brand-mark{font-size:20px;color:#1677ff}
    .shell{min-width:0;background:#f5f5f5}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;flex:none;padding:0 24px;background:#fff;border-bottom:1px solid #f0f0f0}
    .top-left,.top-right,.identity{display:flex;align-items:center}.top-left{gap:24px}.top-right{gap:10px}.identity{gap:8px;color:#262626;font-size:14px}
    .environment{height:36px;display:flex;align-items:center;padding:0 18px;border-radius:5px;background:#52c41a;color:#fff;font-size:20px}
    .page-header{min-height:62px;display:flex;align-items:center;padding:10px 32px;background:#fff;border-bottom:1px solid #f0f0f0}.page-title{margin:0;color:#262626;font-size:20px;line-height:28px;font-weight:600}
    .content{flex:1;min-height:0;overflow:auto;padding:16px 24px 24px}.list-page{min-height:100%;padding:24px;background:#fff}
    .filter-panel{padding:0 0 20px;border-bottom:1px solid #f0f0f0}.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 8px}
    .filter-control{display:flex;align-items:stretch;min-width:0;height:32px}.filter-label{display:flex;align-items:center;flex:none;padding:0 11px;border:1px solid #d9d9d9;border-right:0;border-radius:2px 0 0 2px;background:#fafafa;white-space:nowrap}.filter-value{display:flex;width:100%;min-width:0;height:32px;padding:0 8px 0 12px;border:1px solid #d9d9d9;border-radius:0 2px 2px 0;background:#fff}.filter-value .ant-input,.filter-value .ant-select{width:100%;min-width:0;border:0!important;box-shadow:none!important}.filter-value .ant-input{height:30px;padding:0}.filter-value .ant-select-selector{height:30px!important;padding:0 20px 0 0!important;border:0!important;box-shadow:none!important}.filter-value .ant-select-selection-placeholder,.filter-value .ant-select-selection-item{line-height:30px!important}
    .filter-actions{grid-column:4;display:flex;align-items:center;justify-content:flex-end;gap:8px}.filter-actions .ant-btn{min-width:72px}
    .table-toolbar{display:flex;align-items:center;gap:8px;padding:16px 0}.table-toolbar .ant-btn{min-width:92px}.table-wrap{overflow:hidden}.event-table .ant-table-thead>tr>th{white-space:nowrap}.event-table .ant-table-tbody>tr>td{vertical-align:middle}.event-id-link,.event-name-link{color:#1677ff;text-decoration:none}.event-id-link:hover,.event-name-link:hover{text-decoration:underline}.status-tag{margin-inline-end:0}.total-events{margin-top:12px;color:#595959;font-size:14px}
    @media(max-width:1280px){.content{padding:16px}.list-page{padding:20px}.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filter-actions{grid-column:2;justify-content:flex-end}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="vendor/react-18.3.1.min.js"></script>
  <script src="vendor/react-dom-18.3.1.min.js"></script>
  <script src="vendor/dayjs-1.11.23.min.js"></script>
  <script src="vendor/antd-5.24.8.min.js"></script>
  <script src="vendor/ant-design-icons-5.6.1.min.js"></script>
  <script>
  (()=>{
    const h=React.createElement;
    const {Layout,Menu,ConfigProvider,Input,Select,Button,Table,Dropdown,message,Tag}=antd;
    const I=icons;
    const menuItems=[
      {key:'homepage',icon:h(I.HomeOutlined),label:'Homepage'},
      {key:'dp-orders',icon:h(I.FileTextOutlined),label:'DP Orders'},
      {key:'dp-products',icon:h(I.AppstoreOutlined),label:'DP Products',children:[
        {key:'product-list',label:'Product List'},
        {key:'structure',label:'Product Structure Management',children:[
          {key:'event-list',label:'Event List'},{key:'film-list',label:'Film List'},{key:'cinema-list',label:'Cinema List'},{key:'gift-card-list',label:'Gift Card List'},{key:'ievent-list',label:'IEvent List'},{key:'ievent-home',label:'IEvent Homepage'},{key:'esim-list',label:'ESim List'}
        ]},
        {key:'mass-product',label:'Mass Product Management'}
      ]},
      {key:'marketing-promotion',icon:h(I.LineChartOutlined),label:'Marketing Promotion'},
      {key:'marketing-asset',icon:h(I.NotificationOutlined),label:'Marketing Asset'},
      {key:'user-management',icon:h(I.UserOutlined),label:'User Management'},
      {key:'fe-configuration',icon:h(I.MobileOutlined),label:'FE Configuration'},
      {key:'local-service',icon:h(I.CustomerServiceOutlined),label:'Local Service'},
      {key:'operation',icon:h(I.SlidersOutlined),label:'Operation'},
      {key:'approval-flow',icon:h(I.AuditOutlined),label:'Approval Flow'},
      {key:'fraud-check',icon:h(I.DollarCircleOutlined),label:'Fraud Check'}
    ];
    const events=[
      {key:'1',id:1,name:'Test Events',feStatus:'Online',category:'Theme Parks',country:'Malaysia',city:'Kuala Lumpur',updated:'2026-09-04 10:12:02 +08:00'},
      {key:'2',id:2,name:'Sab Test Event',feStatus:'Online',category:'Theme Parks',country:'Malaysia',city:'Kuala Lumpur',updated:'2024-03-19 15:18:07 +08:00'},
      {key:'3',id:3,name:'Universal Studios Singapore',feStatus:'Online',category:'Concert & Performance',country:'Singapore',city:'Singapore',updated:'2024-03-18 14:10:12 +08:00'},
      {key:'4',id:4,name:'F1 Singapore',feStatus:'Online',category:'Concert & Performance',country:'Singapore',city:'Singapore',updated:'2024-03-19 14:34:57 +08:00'},
      {key:'5',id:5,name:'Genting SkyWorlds Outdoor Theme Park',feStatus:'Offline',category:'Others',country:'Malaysia',city:'Kuala Lumpur',updated:'2024-03-19 14:35:19 +08:00'},
      {key:'6',id:6,name:'Event 5',feStatus:'Offline',category:'Kids',country:'Malaysia',city:'Kuala Lumpur',updated:'2024-03-19 14:36:17 +08:00'},
      {key:'7',id:7,name:'KLCC Aquaria',feStatus:'Offline',category:'Tour Packages',country:'Malaysia',city:'Kuala Lumpur',updated:'2024-03-19 14:34:53 +08:00'},
      {key:'8',id:8,name:'Genting',feStatus:'Online',category:'Experiences & Activities',country:'Malaysia',city:'Kuala Lumpur',updated:'2024-03-19 14:34:44 +08:00'},
      {key:'9',id:9,name:'Awana Skyway',feStatus:'Online',category:'Experiences & Activities',country:'Malaysia',city:'Kuala Lumpur',updated:'2024-04-12 15:01:27 +08:00'},
      {key:'10',id:10,name:'Kuala Lumpur Happening',feStatus:'Online',category:'Concert & Performance',country:'Malaysia',city:'Kuala Lumpur',updated:'2023-06-01 07:45:13 +08:00'}
    ];
    const statusOptions=['Online','Offline'];
    const categoryOptions=['Theme Parks','Concert & Performance','Others','Kids','Tour Packages','Experiences & Activities'];
    const countryOptions=['Malaysia','Singapore'];
    const cityOptions=['Kuala Lumpur','Singapore'];
    function StatusTag({status}){return h(Tag,{className:'status-tag',color:status==='Online'?'success':'default'},status)}
    function Field({label,value,onChange,options}){
      const select=Array.isArray(options);
      return h('label',{className:'filter-control'},h('span',{className:'filter-label'},label),h('span',{className:'filter-value'},select?h(Select,{value:value||undefined,allowClear:true,placeholder:'Please select',options:options.map(item=>({value:item,label:item})),onChange:value=>onChange(value||'')}):h(Input,{value,onChange:event=>onChange(event.target.value),placeholder:'Input'})));
    }
    function App(){
      const [openKeys,setOpenKeys]=React.useState(['dp-products','structure']);
      const [filterValues,setFilterValues]=React.useState({id:'',name:'',country:'',city:''});
      const [appliedFilters,setAppliedFilters]=React.useState({id:'',name:'',country:'',city:''});
      const [messageApi,holder]=message.useMessage();
      const setFilter=(key,value)=>setFilterValues(previous=>({...previous,[key]:value}));
      const search=()=>{setAppliedFilters({...filterValues});messageApi.success('Search completed')};
      const reset=()=>{const empty={id:'',name:'',country:'',city:''};setFilterValues(empty);setAppliedFilters(empty);messageApi.info('Filters have been reset')};
      const visibleEvents=events.filter(item=>{
        const idMatch=!appliedFilters.id||String(item.id).includes(appliedFilters.id.trim());
        const nameMatch=!appliedFilters.name||item.name.toLowerCase().includes(appliedFilters.name.trim().toLowerCase());
        return idMatch&&nameMatch&&(!appliedFilters.country||item.country===appliedFilters.country)&&(!appliedFilters.city||item.city===appliedFilters.city);
      });
      const columns=[
        {title:'Event ID',dataIndex:'id',key:'id',width:100,fixed:'left',render:value=>h('a',{href:'event-detail.html',className:'event-id-link'},String(value))},
        {title:'Event Name',dataIndex:'name',key:'name',width:260},
        {title:'FE Status',dataIndex:'feStatus',key:'feStatus',width:150,filters:statusOptions.map(value=>({text:value,value})),onFilter:(value,record)=>record.feStatus===value,render:value=>h(StatusTag,{status:value})},
        {title:'FE Category',dataIndex:'category',key:'category',width:230,filters:categoryOptions.map(value=>({text:value,value})),onFilter:(value,record)=>record.category===value},
        {title:'Country / Region',dataIndex:'country',key:'country',width:180},
        {title:'City',dataIndex:'city',key:'city',width:180},
        {title:'Updated Time',dataIndex:'updated',key:'updated',width:230}
      ];
      const massMenu={items:[{key:'add-event',icon:h(I.PlusOutlined),label:'Add Event'},{key:'batch-edit',icon:h(I.EditOutlined),label:'Batch Edit'}],onClick:({key})=>messageApi.info(key==='add-event'?'Add Event selected':'Batch Edit selected')};
      return h(ConfigProvider,{theme:{token:{colorPrimary:'#1677ff',colorSuccess:'#52c41a',colorError:'#ff4d4f',colorBgLayout:'#f5f5f5',colorText:'#262626',colorTextSecondary:'#8c8c8c',colorBorder:'#f0f0f0',borderRadius:4,controlHeight:32,fontSize:14},components:{Menu:{itemHeight:46,itemColor:'#262626',itemSelectedColor:'#1677ff',itemSelectedBg:'#e6f4ff',iconSize:16},Table:{headerBg:'#fafafa'}}}},
        h(React.Fragment,null,
          holder,
          h(Layout,{className:'app'},
            h(Layout.Sider,{className:'sider',width:240},
              h('div',{className:'brand'},h(I.ApiOutlined,{className:'brand-mark'}),'Digital Product Admin'),
              h(Menu,{mode:'inline',items:menuItems,selectedKeys:['ievent-list'],openKeys,onOpenChange:setOpenKeys,style:{borderInlineEnd:0}})
            ),
            h(Layout,{className:'shell'},
              h('header',{className:'topbar'},
                h('div',{className:'top-left'},h(I.MenuUnfoldOutlined,{style:{fontSize:20,color:'#262626'}}),h('span',{className:'environment'},'Non-Live Environment')),
                h('div',{className:'top-right'},h(Select,{value:'MY',options:[{value:'MY',label:'MY'}],style:{width:100}}),h(Select,{value:'UAT',options:[{value:'UAT',label:'UAT'}],style:{width:100}}),h('span',{className:'identity'},h(I.UserOutlined,{style:{fontSize:18}}),'kaibin.liu'))
              ),
              h('section',{className:'page-header'},h('h1',{className:'page-title'},'IEvent List')),
              h('main',{className:'content'},
                h('div',{className:'list-page'},
                  h('section',{className:'filter-panel'},
                    h('div',{className:'filter-grid'},
                      h(Field,{label:'ID:',value:filterValues.id,onChange:value=>setFilter('id',value)}),
                      h(Field,{label:'Name:',value:filterValues.name,onChange:value=>setFilter('name',value)}),
                      h(Field,{label:'Country/Region:',value:filterValues.country,onChange:value=>setFilter('country',value),options:countryOptions}),
                      h(Field,{label:'City:',value:filterValues.city,onChange:value=>setFilter('city',value),options:cityOptions}),
                      h('div',{className:'filter-actions'},h(Button,{type:'primary',onClick:search},'Search'),h(Button,{onClick:reset},'Reset'))
                    )
                  ),
                  h('div',{className:'table-toolbar'},h(Button,{icon:h(I.DownloadOutlined),onClick:()=>messageApi.success('Download started')},'Download'),h(Dropdown,{menu:massMenu},h(Button,null,'Mass Operation'))),
                  h('div',{className:'table-wrap'},h(Table,{className:'event-table',columns,dataSource:visibleEvents,rowKey:'key',size:'middle',bordered:false,scroll:{x:1230},pagination:{current:1,pageSize:10,total:927,showSizeChanger:false,showQuickJumper:true,showTotal:()=>h('span',{className:'total-events'},'Total Events: 927'),position:['bottomRight']}}))
                )
              )
            )
          )
        )
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  })();
  </script>
</body>
